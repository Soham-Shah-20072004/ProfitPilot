<style>

*{box-sizing:border-box}

.dots{display:flex;gap:6px;justify-content:center;padding:8px 0 2px}.dots i{width:8px;height:8px;border-radius:9px;background:var(--ln)}.dots i.on{background:var(--pk);width:20px}.dots i.dn{background:var(--sa)}
.stack{display:flex;height:46px;border-radius:12px;overflow:hidden;margin:10px 0}.stack>div{height:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:800;overflow:hidden;white-space:nowrap}

.ruler{position:relative;height:92px;margin:10px 8px 4px}

<script>

const R1=v=>(v<0?'−':'')+'₹'+Math.abs(v).toLocaleString('en-IN',{maximumFractionDigits:1});

const floor9=x=>Math.floor((x+1)/10)*10-1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

 ethnic:{n:'Ethnic wear',uRet:226,uRto:175,o:{dmg:4,promo:6,ads:12,tax:10,cap:12},ret:12,rto:8,life:'3–6 months',beta:-3},
 kitchen:{n:'Home & kitchen',uRet:240,uRto:190,o:{dmg:3,promo:7,ads:12,tax:12,cap:12},ret:5,rto:7,life:'12+ months',beta:-3},
 beauty:{n:'Beauty',uRet:120,uRto:110,o:{dmg:2,promo:5,ads:9,tax:6,cap:6},ret:4,rto:9,life:'~9 months (expiry)',beta:-3},
 kids:{n:'Kids wear',uRet:200,uRto:160,o:{dmg:3,promo:6,ads:12,tax:10,cap:12},ret:10,rto:8,life:'4–6 months',beta:-3},
 decor:{n:'Home décor',uRet:230,uRto:180,o:{dmg:16,promo:6,ads:8,tax:7,cap:4},ret:9,rto:8,life:'6–12 months',beta:-3,dmgNote:'+6% breakage'}
};

 kurti:{n:'Printed Kurti',em:'👗',cat:'ethnic',price:399,live:369,cs:180,pack:10,fwd:25,ret:12,rto:8,T:60,ord:23,band:[329,429],med:379,look:24,rival:299,frec:283,life:180,

 lunch:{n:'Steel lunch box',em:'🍱',cat:'kitchen',price:449,live:449,cs:210,pack:15,fwd:45,ret:5,rto:7,T:63,ord:12,band:[379,499],med:439,look:31,rival:329,frec:317,life:360,

 serum:{n:'Vitamin-C serum',em:'🧴',cat:'beauty',price:249,live:249,cs:90,pack:8,fwd:22,ret:4,rto:9,T:33,ord:30,band:[199,299],med:259,look:40,rival:159,frec:152,life:270,

 vase:{n:'Ceramic vase',em:'🏺',cat:'decor',price:499,live:499,cs:220,pack:25,fwd:40,ret:9,rto:8,T:72,ord:5.5,band:[449,599],med:519,look:12,rival:349,frec:260,life:300,

const MODES={

 growth:{n:'GROWTH',ic:'🌱',c:'#1B8A5A',def:'OK to start with a small margin to get sales first, then increase slowly.',
   hi:'Shuru mein kam margin chalega, pehle sales chahiye, phir dheere-dheere badhao.',obj:'₹ profit per impression, after a volume-first launch'},
 margin:{n:'MARGIN',ic:'🛡️',c:'#5B0A48',def:'Strict about margin.',hi:'Margin par sakht.',obj:'₹ profit per impression, only arms with ≥ target profit per kept order'},

const sk=id=>SK[id||S.sku];
const live=id=>S.live[id]!=null?S.live[id]:SK[id].live;

/* ---- Return-adjusted floor F = ΣC per kept order ---- */
function FL(id){id=id||S.sku;const b=SK[id],o=S.ov[id]||{},c=Object.assign({},b,o),C=CAT[c.cat];
 const disp=97,rtoN=Math.round(disp*c.rto/100),deliv=disp-rtoN,retN=Math.round(deliv*c.ret/100),kept=deliv-retN,k=kept/100;
 const Cret=Math.round(retN*C.uRet/kept),Crto=Math.round(rtoN*C.uRto/kept),O=C.o,oth=O.dmg+O.promo+O.ads+O.tax+O.cap;
 const F=c.cs+c.pack+c.fwd+Cret+Crto+oth,T=c.T,Pe=F+T,gap=Math.max(10,10*Math.round(Cret/10)),Pn=Pe-gap,Fno=F-Cret;
 const u=Math.max(10,Math.round(Pe*0.0813/10)*10);
 const arms=[Pn-u-10,Pn,Pe,Pe+u,Pe+2*u];
 return {id,c,C,F,k,kept,deliv,retN,rtoN,Cret,Crto,oth,O,cs:c.cs,pack:c.pack,fwd:c.fwd,ret:c.ret,rto:c.rto,T,Pe,Pn,gap,Fno,kno:deliv/100,B:Cret+Crto,sm:Math.round(F*Math.sqrt((c.ret/100)*(1-c.ret/100)/58+(c.rto/100)*(1-c.rto/100)/245)/k),
   Fplus:ceil9(F/0.97),Pm:Math.max(Pe,ceil9(F/0.78)),Pg:ceil9(F/0.92),arms,frec:Math.min(b.frec,F-1)};
}
function modePrice(id,m){const f=FL(id);m=m||S.mode;
 if(m==='cash')return{lead:f.Pn,alt:f.Pe,lbl:t('No-return ','No-return ')+R(f.Pn)+' + '+t('prepaid nudge','prepaid nudge'),m:1-f.Fno/f.Pn};
 if(m==='growth')return{lead:f.Pn,alt:f.Pe,lbl:R(f.Pn)+'–'+R(f.Pe),m:1-f.F/f.Pe};
 if(m==='margin')return{lead:f.Pm,alt:f.Pe+2*(f.arms[3]-f.Pe),lbl:R(f.Pm)+' ('+t('arms','arms')+' '+R(f.Pe)+'–'+R(f.arms[4])+')',m:1-f.F/f.Pm};
 return{lead:f.Fplus,alt:f.Fplus,lbl:R(f.Fplus)+' · '+t('never below','kabhi neeche nahi')+' '+R(f.F),m:1-f.F/f.Fplus};
}
/* ---- Demand: ln q = α + β ln p (β = −3 category prior) + look-alike penalty above the median ---- */
const pen=(p,med)=>p>med?Math.exp(-GAMMA*Math.pow((p-med)/med,2)):1;
function demand(id,p,kink){const s=SK[id],L=s.live,k0=kink===false?1:pen(p,s.med)/pen(L,s.med);return s.ord*Math.pow(p/L,BETA)*k0}
function profitDay(id,p,kink){const f=FL(id);return demand(id,p,kink)*f.k*(p-f.F)}
const confOf=v=>v>=5000?'High':v>=1000?'Medium':'Low';
const CONF_C={High:'#1B8A5A',Medium:'#F58A0B',Low:'#D32F2F'};
const confB=c=>`<span class="conf" style="background:${CONF_C[c]}">${t(c,{High:'Zyada',Medium:'Medium',Low:'Kam'}[c])}</span>`;

/* ---- Trigger hygiene / pre-flight ---- */
const HYG=[
 ['Max step','8% per move','Buyers notice jumps above ~10%; a small step keeps the elasticity estimate local (we only trust β near the price we observed).'],
 ['Min data','1,000 views = sanity check','At 4% CTR × 12% CVR, 1,000 views ≈ 5 orders: enough to see buyers are ordering, far too few to measure price sensitivity. That is learned across similar products (pooled).'],
 ['Cooldown','7 days per SKU','One full weekday + weekend cycle, so day-of-week swings are not mistaken for a price effect.'],
 ['Stability','≤ 2 price moves / month','No flapping: buyers and resellers who share links need to trust the price.'],
 ['Floor','never below F','Every published price covers return-adjusted cost per kept order. Recovery floor only at Exit, with explicit consent.'],
 ['Auto-revert','judge day 14 · confirm day 28','Orders react within days, but returns arrive late (return-window lag). Day 14: if profit per impression is worse on orders, the price goes back. Day 28: confirmed on kept orders, once returns have matured.']];
function preflight(id,from,to,o){o=o||{};const f=FL(id),s=SK[id],step=(to-from)/from*100,v=o.views!=null?o.views:s.sig.views,d=o.dsm!=null?o.dsm:dsm(id),mm=o.mpm!=null?o.mpm:mpm(id);
 const floorOk=o.consent?to>=f.frec:to>=f.F;
 return [
  {k:'Floor',ok:floorOk,d:o.consent?`${R(to)} ≥ recovery floor ${R(f.frec)} (seller consented)`:`${R(to)} ${to>=f.F?'≥':'<'} floor ${R(f.F)}`},
  {k:'Step ≤ 8%',ok:Math.abs(step)<=8.0001,d:`${pct(step,1)} (${R(from)} → ${R(to)})`},
  {k:'Views ≥ 1,000',ok:v>=1000,d:`${Math.round(v).toLocaleString('en-IN')} views at current price (sanity check)`},
  {k:'Cooldown 7 days',ok:d>=7,d:`${d} day${d===1?'':'s'} since last move`},
  {k:'≤ 2 moves / month',ok:mm<2,d:`${mm} move${mm===1?'':'s'} this month`},
  {k:'Auto-revert at 14 days',ok:true,na:true,d:'scheduled: day 14 on orders, day 28 confirmed on kept orders'}];
}
const pfOk=l=>l.every(x=>x.ok);
const ckList=l=>l.map(x=>`<div class="ck ${x.na?'na':x.ok?'ok':'bad'}"><b>${x.na?'↺':x.ok?'✔':'✘'}</b><span><b style="width:auto;text-align:left">${x.k}</b> · ${x.d}</span></div>`).join('');

/* ---- Recommendation engine (per SKU, per goal mode) ---- */
function recFor(id){const s=SK[id],g=s.sig,f=FL(id),p=live(id),F=f.F,m=S.mode,L=S.lang,kr=g.kr||Math.round(f.k*100),kA=Math.round(f.k*100);
 const r={id,from:p,to:p,kind:'hold',m};const cooldown=dsm(id)<7||mpm(id)>=2;
 const eff=(to)=>{const o1=demand(id,p),o2=demand(id,to),d1=o1*f.k*(p-F),d2=o2*f.k*(to-F);return{o1,o2,d1,d2,txt:`${R(to-F)} ${t('profit per kept order','kamai / kept order')} (${t('was','pehle')} ${R(p-F)}) · ${t('orders','orders')} ${o1.toFixed(1)} → ${o2.toFixed(1)}/${t('day','din')} · ${t('profit/day','kamai/din')} ${R(d1)} → ${R(d2)} (${pct((d2-d1)/Math.abs(d1||1)*100)})`}};
 const growthTree=(hit)=>({t:t('Growth decision tree','Growth decision tree'),n:[
   {q:'Conversion holds 2 weeks? (CVR ≥ median)',no:'hold price, fix funnel (Diagnose)',yes:'continue',v:g.cvr>=g.cvrMed&&g.cvrWk>=2?'yes':'no',d:`CVR ${g.cvr}% vs median ${g.cvrMed}% for ${g.cvrWk} wk`},
   {q:'Stock cover ≥ 30 days?',no:'replenish first (reorder alert, 2.0)',yes:'continue',v:g.doi>=30?'yes':'no',d:`${g.doi} days of stock`},

 const declineTree=()=>({t:'Decline decision tree',n:[
   {q:'Kept units −15% over 4 weeks, or days of inventory > 60?',no:'stay mature: protect margin',yes:'continue',v:(g.g<-15||g.doi>60)?'yes':'no',d:`g = ${pct(g.g)}, DOI ${g.doi} days`},
   {q:'Seasonal dip?',yes:'park for next season, or Meesho widens reach to similar regions (seller approves)',no:'continue',v:'no',d:'demand fell outside the category\'s seasonal pattern (demo)'},
   {q:'Price > full cost F?',yes:'bundle first → markdown (≤ 8% steps, never below F without consent)',no:'Exit only: B2B lot or delist, with seller consent',v:p>F?'yes':'no',d:`${R(p)} vs F ${R(F)}`}],out:'bundle → markdown'});
 const undoMove=(to)=>`${t('Nothing changes until you tap YES. Undo in 24 h. Auto-revert check at 14 days: if profit per impression at','YES dabane tak kuch nahi badlega. 24 ghante mein undo. 14 din par auto-revert check: agar')} ${R(to)} ${t('is worse than at','par kamai/impression')} ${R(p)}${t(', the price goes back to ',' se kam hui, to price wapas ')}${R(p)}.`;
 const base=[`${t('Floor','Floor')} F = ${R(F)} (${t('return-adjusted, kept rate','return-adjusted, kept rate')} k = ${f.k.toFixed(2)})`,`${(g.views).toLocaleString('en-IN')} ${t('views at','views')} ${R(p)} (${t('min 1,000','kam se kam 1,000')})`];
 if(cooldown){Object.assign(r,{kind:'hold',h:t(`Hold ${R(p)}: cooldown`,`${R(p)} rakho: cooldown`),sub:t(`Last move ${dsm(id)} day(s) ago · ${mpm(id)} move(s) this month.`,`Pichla badlav ${dsm(id)} din pehle.`),
   why:[`Cooldown is 7 days per SKU and ≤ 2 moves a month; this SKU moved ${dsm(id)} day(s) ago (${mpm(id)} this month).`,...base],eff:t('₹0 now. The 14-day auto-revert check on the last move is still running.','Abhi ₹0. Pichle badlav ka 14 din check chal raha hai.'),undo:t('Nothing to undo. Next weekly check in 7 days.','Kuch undo nahi. Agla check 7 din mein.')});return fin(r,id)}
 if(m==='clear'){
   if(p>f.Fplus){const to=Math.max(f.Fplus,ceil9(p*0.92));const e=eff(to);Object.assign(r,{to,kind:'down',h:t(`Bundle first, then ${R(p)} → ${R(to)}`,`Pehle bundle, phir ${R(p)} → ${R(to)}`),
     sub:t(`CLEAR mode: sell fast, never below your cost ${R(F)}.`,`CLEAR mode: jaldi becho, ${R(F)} se neeche nahi.`),
     why:[`Goal mode CLEAR: objective = kept orders per impression, never below F ${R(F)}.`,`Step capped at 8%: ${R(p)} × 0.92 = ${R(p*0.92)} → ${R(to)} (${pct((to-p)/p*100,1)}).`,`Clearance target ${R(f.Fplus)} = F ÷ 0.97 (m = 3%). Deeper recovery floor ${R(f.frec)} only at Exit with explicit consent.`,...base],eff:e.txt,
     undo:undoMove(to),logic:{t:'CLEAR mode guard',n:[{q:'Bundle with a fast mover possible?',yes:'offer bundle first (recovers 50–80%)',no:'continue',v:'yes',d:'demo: yes'},{q:'Next step ≥ floor F?',yes:'markdown ≤ 8% step',no:'stop at F; recovery floor needs consent at Exit',v:to>=F?'yes':'no',d:`${R(to)} vs ${R(F)}`}],out:'bundle + step'}});return fin(r,id)}
   Object.assign(r,{h:t(`Hold ${R(p)}: already at clearance floor`,`${R(p)} rakho`),why:[`Price ${R(p)} is at F ÷ 0.97 = ${R(f.Fplus)}. CLEAR never goes below F ${R(F)} without Exit-stage consent.`],eff:'₹0',undo:'Nothing changes.'});return fin(r,id)}
 if(m==='cash'&&g.stage!=='decline'){const f2=f,cdE=15,cdN=8,rpdE=(f2.Pe-F)/(F*cdE),pn=p-f.gap,rpdN=(pn-f.Fno)/(f.Fno*cdN);
   Object.assign(r,{to:pn,kind:'dual',h:t(`Lead with No-return ${R(pn)} + prepaid nudge`,`No-return ${R(pn)} aage rakho + prepaid nudge`),sub:t(`Easy-returns ${R(p)} stays on. No-return orders can't come back, so cash is final sooner.`,`Easy-returns ${R(p)} bhi rahega. No-return order wapas nahi aata, paisa jaldi pakka.`),
     why:[`Goal mode CASH: objective = ₹ profit per rupee-day.`,`No-return floor = F − C_ret = ${R(F)} − ${R(f.Cret)} = ${R(f.Fno)}; profit per kept order ${R(pn-f.Fno)} (vs ${R(p-F)} easy-returns).`,`Assumed cash cycle: easy-returns ≈ ${cdE} days (return window), no-return ≈ ${cdN} days (assumption to confirm with Meesho).`,`Meesho dual pricing: >30% of buyers pick the lower no-return price; ~10% fewer returns (source: Singhal, Medium, Jul 2025).`],
     eff:`${t('Profit per rupee-day','Kamai / rupee-din')}: ${(rpdE*100).toFixed(2)}% → ${(rpdN*100).toFixed(2)}% (${(rpdN/rpdE).toFixed(1)}×). ${t('Price shown to buyers who pick no-return','No-return chunne walon ka price')}: ${R(pn)}.`,
     undo:t('Uses Meesho\'s existing dual-pricing field; switch the lead back to easy-returns any time. 14-day check on cash cycle and returns.','Meesho ke dual-pricing field se; kabhi bhi wapas. 14 din check.'),
     logic:{t:'CASH mode routing',n:[{q:'Is the no-return price ≥ its own floor (F − C_ret)?',yes:'lead with no-return + prepaid nudge',no:'keep easy-returns',v:pn>=f.Fno?'yes':'no',d:`${R(pn)} vs ${R(f.Fno)}`}],out:'dual price, no-return first'}});return fin(r,id)}
 if(m==='margin'){const tgt=f.Pm;if(g.stage==='decline'){Object.assign(r,{kind:'hold',h:t(`Hold ${R(p)} · bundle instead of markdown`,`${R(p)} rakho · markdown ki jagah bundle`),sub:t('MARGIN mode accepts lower volume; no markdown.','MARGIN mode: kam volume chalega.'),why:[`Goal mode MARGIN: only prices with ≥ ${R(f.T)} profit per kept order.`,`Stock is stuck (DOI ${g.doi} days), but a markdown would break your margin rule. Bundle keeps the unit price.`,...base],eff:t(`Keeps ${R(p-F)} per kept order; stock clears slower (~${Math.round(g.doi*0.8)} days with a bundle).`,''),undo:t('Nothing changes on price.','Price nahi badlega.'),logic:declineTree()});return fin(r,id)}
   if(p<tgt){let to=Math.min(tgt,floor9(p*1.08));if(to<=p)to=Math.round(p*1.08);const e=eff(to);Object.assign(r,{to,kind:'up',h:t(`Raise ${R(p)} → ${R(to)} (margin target)`,`${R(p)} → ${R(to)} badhao`),sub:t(`MARGIN mode: target ${R(tgt)} (m = 22%), capped at 8% per step.`,`MARGIN mode: target ${R(tgt)}.`),
     why:[`Goal mode MARGIN: target P* = F ÷ (1 − m) = ${R(F)} ÷ 0.78 = ${R(F/0.78)} → ${R(tgt)}.`,`Only arms with ≥ ${R(f.T)} profit per kept order are allowed (${R(f.Pe)}–${R(f.arms[4])}).`,`Max step 8%: ${R(p)} × 1.08 = ${R(p*1.08)} → ${R(to)}. Lower volume is accepted in this mode.`,...base],eff:e.txt,undo:undoMove(to)});return fin(r,id)}
   Object.assign(r,{h:t(`Hold ${R(p)}: margin already met`,`${R(p)} rakho: margin theek`),why:[`Profit per kept order ${R(p-F)} ≥ target ${R(f.T)}; m = ${((1-F/p)*100).toFixed(0)}%.`,...base],eff:'₹0 · no change',undo:t('Nothing changes. Next weekly check in 7 days.','Kuch nahi badlega.')});return fin(r,id)}
 /* growth (default) + cash-in-decline */

/* ================= LIFECYCLE ================= */
const LCS={day:{},consent:false,exitSt:{}};
function lcModel(id,P0o){const s=SK[id],f=FL(id),L=s.life,sc=L/180,P0=P0o||s.live,P1=Math.round(P0*1.04),Rv=Math.round(P1*0.935);
 const D=x=>Math.round(x*sc),w={launch:D(30),growth:D(60),maturity:D(120),decline:D(155)};
 /* Rival test: the rival takes ~30% of orders at the held price. If we match, the rival is STILL there,
    so match demand starts from the post-rival level and only gains the price effect (β = −3). */
 const preO=Math.round(demand(id,P1)),holdO=Math.round(demand(id,P1)*0.7),matchO=+(holdO*Math.pow(P1/P0,3)).toFixed(1);
 const hold=holdO*f.k*(P1-f.F),match=matchO*f.k*(P0-f.F),doMatch=match>hold,Pm=doMatch?P0:P1;
 /* products already past the rival event: their live price is the post-rival price */
 if(!P0o&&!doMatch&&s.sig.day>D(56))return lcModel(id,Math.round(s.live/1.04));
 const M1=ceil9(Pm*0.92),M2=ceil9(M1*0.92),M3=Math.max(f.Fplus,ceil9(M2*0.92));
 const ev=[[D(38),P1,`${R(P0)} → ${R(P1)} (+4% Growth step)`],[D(52),P1,`Rival lists ${R(Rv)}`],[D(56),Pm,doMatch?`Partial match ${R(P1)} → ${R(P0)}`:`Hold ${R(P1)}: matching earns less`],[D(140),M1,`Markdown ${R(Pm)} → ${R(M1)}`],[D(154),M2,`${R(M1)} → ${R(M2)}`],[D(176),M3,`${R(M2)} → ${R(M3)} (clearance, ≥ F)`]];
 const a=demand(id,P0),b=demand(id,P1),c=doMatch?matchO:holdO,e=demand(id,Pm);
 const ordPts=[[0,a*8/23],[15,a*14/23],[30,a*19/23],[36,a],[38,b],[52,b],[54,holdO],[56,c],[90,e],[105,e*21/22],[120,e*17/22],[130,e*11/22],[140,e*7/22],[155,e*5/22],[175,e*4/22],[180,e*3/22]].map(p=>[D(p[0]),+p[1].toFixed(1)]);
 return {s,f,L,sc,P0,P1,Rv,Pm,doMatch,M1,M2,M3,w,ev,ordPts,D,holdO,matchO,preO,hold,match}}
function lcStage(m,d){return d<m.w.launch?'launch':d<m.w.growth?'growth':d<m.w.maturity?'maturity':d<m.w.decline?'decline':'exit'}
function lcPrice(m,d){let p=m.P0;m.ev.forEach(e=>{if(d>=e[0])p=e[1]});if(LCS.consent&&d>=m.D(178))p=Math.max(m.f.frec,ceil9(m.M3*0.94));return p}

const EN={sku:null,mode:null,day:0,arms:[],hold:null,seed:1,dsm:10,mpm:0,route:null};
function gauss(r){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function gammaS(a,r){if(a<1){return gammaS(a+1,r)*Math.pow(r(),1/a)}const d=a-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=gauss(r);v=1+c*x}while(v<=0);v=v*v*v;const u=r();if(u<1-0.0331*x*x*x*x)return d*v;if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v}}
function betaS(a,b,r){const x=gammaS(a,r),y=gammaS(b,r);return x/(x+y)}
let ER=rng(7);
function enTrue(id,p){const s=SK[id],f=FL(id),Pe=f.Pe;return CTR0*CVR0*Math.pow(p/Pe,BETA)*pen(p,s.med)*f.k}
function enPrior(id,p){const f=FL(id),s=SK[id];return CTR0*CVR0*Math.pow(p/f.Pe,BETA)*(p>s.med?Math.exp(-GAMMA*0.5*Math.pow((p-s.med)/s.med,2)):1)*f.k}
function enObj(id,a){const f=FL(id),m=S.mode,mg=a.p-f.F;if(m==='clear')return 1;return mg}
function enElig(id,a){const f=FL(id);if(a.p<f.F)return false;if(S.mode==='margin'&&a.p-f.F<f.T)return false;return true}
function enReset(){const id=S.sku,f=FL(id);ER=rng(EN.seed);EN.sku=id;EN.mode=S.mode;EN.day=0;EN.last=null;
 /* each arm = a price MENU: easy-returns p and no-return p − gap (gap ≈ return cost saved, so margin ≈ p − F either way) */
 EN.arms=f.arms.filter((p,i)=>i!==1).map((p,i)=>{const pr=enPrior(id,p);return {p,pn:p-f.gap,a0:N0*pr,b0:N0*(1-pr),a:N0*pr,b:N0*(1-pr),n:0,kept:0,th:enTrue(id,p)}});
 EN.hold={p:SK[id].price,n:0,kept:0,th:enTrue(id,SK[id].price)}}
function enStep(days){const id=EN.sku,f=FL(id);const el=EN.arms.filter(a=>enElig(id,a));if(!el.length)return;
 /* time-block rotation: ONE Thompson draw per day; that menu is live for every buyer all day */
 for(let d=0;d<days;d++){let best=null,bv=-1;for(const a of el){const th=betaS(a.a,a.b,ER),v=th*enObj(id,a);if(v>bv){bv=v;best=a}}
   for(let b=0;b<48;b++){let k=0;for(let i=0;i<95;i++)if(ER()<best.th)k++;best.n+=95;best.kept+=k;best.a+=k;best.b+=95-k;
   let hk=0;for(let i=0;i<5;i++)if(ER()<EN.hold.th)hk++;EN.hold.n+=5;EN.hold.kept+=hk}EN.day++;EN.last=best}}
async function enRun(d){if(!API.on){if(EN.sku!==S.sku||EN.mode!==S.mode)enReset();enStep(d);enDraw();return}
 if(API.busy)return;API.busy=true;try{const k=S.sku+'|'+S.mode+'|'+EN.seed;if(!API.exp||API.exp.k!==k||EN.sku!==S.sku||EN.mode!==S.mode||!EN.srv){enReset();const e=await api('/experiments',{method:'POST',body:{product_id:S.sku,mode:S.mode,seed:EN.seed-6,holdout_price:SK[S.sku].price}});API.exp={k,id:e.id}}
  const res=await api('/experiments/'+API.exp.id+'/simulate',{method:'POST',body:{days:d}});enFromServer(res)}catch(e){toast(t('Could not save: ','Save nahi hua: ')+e.message)}API.busy=false;enDraw()}

function aiKw(x,tab){x=' '+x.toLowerCase()+' ';let best='other',n=0;for(const k in tab){const c=tab[k][tab[k].length-1].filter(w=>x.includes(w)).length;if(c>n){best=k;n=c}}return best}
function aiOfflineReturns(lines){const n=lines.length,c={};lines.forEach(l=>{const k=aiKw(l,AI_RET);c[k]=(c[k]||0)+1});const groups=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({code:k,reason:AI_RET[k][0],count:v,share_pct:Math.round(100*v/n),owner:AI_RET[k][1],fix:AI_RET[k][2]}));
 const top=groups.find(g=>g.owner==='seller');return {total:n,groups,seller_fixable_pct:Math.round(100*groups.filter(g=>g.owner==='seller').reduce((a,g)=>a+g.count,0)/n),top_fix:top?{reason:top.reason,fix:top.fix,share_pct:top.share_pct}:null,engine:'rules'}}
function aiOfflineReviews(lines){const n=lines.length,sent={positive:0,neutral:0,negative:0},tp={},neg={};lines.forEach(l=>{const x=l.toLowerCase(),ng=AI_NEG.filter(w=>x.includes(w)).length,ps=AI_POS.filter(w=>x.includes(w)).length,sv=ng>ps?'negative':ps>ng?'positive':'neutral';sent[sv]++;
  const ts=Object.keys(AI_REV).filter(k=>AI_REV[k][1].some(w=>x.includes(w)));(ts.length?ts:['other']).forEach(k=>{tp[k]=(tp[k]||0)+1;if(sv==='negative')neg[k]=(neg[k]||0)+1})});

 const miss=need.filter(k=>!(syn[k]||[k]).some(w=>(' '+x+' ').includes(w)));
 if(b.title.length>100)issues.push({field:'title',problem:'Title is long; it gets cut on phones.',fix:'Keep it under 90 characters.',severity:'medium'});

 if(b.description.length<60)issues.push({field:'description',problem:'Description is very short.',fix:'Add material, size / dimensions, care and pack contents.',severity:'high'});
 miss.forEach(m=>issues.push({field:'attributes',problem:'No '+m+' given.',fix:'Add the '+m+'; buyers return items when this is unclear.',severity:['size','age','expiry','dimensions'].includes(m)?'high':'medium'}));
 const art=craft.length?Math.min(1,0.25*craft.length):0.05,sc=Math.max(0,100-issues.reduce((a,i)=>a+({high:12,medium:6,low:3}[i.severity]),0));
 const r={category:b.category,artisan_score:art,handmade_signals:craft,listing_score:sc,listing_gate:80,issues,missing_attributes:miss,improved_title:b.title.slice(0,90),compliance:[{rule:'Legal Metrology: MRP, net quantity, manufacturer, country of origin',status:x.includes('mrp')?'ok':'check',note:'Show these on the pack and listing.'}],

VIEWS.ai=()=>{const L=AI_SAMPLE.listing,k=AIT.tab;return `<h1>✨ ${t('AI tools','AI tools')}</h1><div class="mu sm">${API.on&&API.ai&&API.ai.active?t('Powered by Gemini. Money numbers still come from the ProfitPilot engine.','Gemini se. Paise ke number engine se.'):API.on?t('Running on the baseline models (no Gemini key set on the backend).','Baseline models par.'):t('Demo mode: a simple keyword baseline runs on this phone. The live app uses Gemini.','Demo mode: keyword baseline.')}</div>
 <div class="seg" style="margin:10px 0">${[['listing',t('Listing check','Listing check')],['returns',t('Return reasons','Return reasons')],['reviews',t('Reviews','Reviews')]].map(x=>`<button class="${k===x[0]?'on':''}" onclick="aiTab('${x[0]}')">${x[1]}</button>`).join('')}</div>
 ${k==='listing'?`<div class="card"><label class="sm b">${t('Title','Title')}</label><input id="aiT" class="inp" value="${esc(L.title)}" maxlength="300"><label class="sm b">${t('Description','Description')}</label><textarea id="aiD" class="inp" rows="3" maxlength="5000">${esc(L.desc)}</textarea>
  <div style="display:flex;gap:8px"><div style="flex:1"><label class="sm b">${t('Category','Category')}</label><select id="aiC" class="inp">${Object.keys(CAT).map(c=>`<option value="${c}" ${c===L.cat?'selected':''}>${CAT[c].n}</option>`).join('')}</select></div><div style="flex:1"><label class="sm b">${t('Your cost ₹ (optional)','Aapki lagat ₹')}</label><input id="aiCost" class="inp" type="number" min="1" value="${L.cost}"></div></div>
  <label class="sm b">${t('Product photo (optional)','Photo (optional)')}</label><input type="file" accept="image/*" capture="environment" onchange="aiImg(this)" class="inp"><div id="aiPrev"></div>
  <button class="btn p full" style="margin-top:8px" onclick="aiRun('listing')">🔎 ${t('Check my listing','Listing check karo')}</button></div>`
 :`<div class="card"><label class="sm b">${k==='returns'?t('Return reasons, one per line (any language)','Return reasons, ek line mein ek'):t('Buyer reviews, one per line (any language)','Reviews, ek line mein ek')}</label><textarea id="aiX" class="inp" rows="7">${esc(AI_SAMPLE[k])}</textarea>
  <button class="btn p full" style="margin-top:8px" onclick="aiRun('${k}')">${k==='returns'?'↩️ '+t('Group the reasons','Reasons group karo'):'💬 '+t('Find what buyers say','Buyers kya keh rahe')}</button>${k==='returns'?`<div class="xs mu" style="margin-top:4px">${t('Costed with the category cost of one return for','Cost:')} ${sk().em} ${sk().n}</div>`:''}</div>`}
 <div id="aiOut">${aiOut(k)}</div>`};

/* ================= SERVER (optional) =================
   The same file runs offline (CodeSandbox / opened from disk) and with the ProfitPilot backend.
   When it is served by the backend (python run.py → http://localhost:8000) it detects /api/v1/health,
   loads the seller's live state, and sends every decision to the server, which re-checks the guardrails. */
/* To use a hosted backend from a static copy of this page (e.g. CodeSandbox), put its URL here, e.g. 'https://profitpilot.onrender.com'.
   You can also open the page with ?api=https://your-backend. Leave empty for same-origin / offline. */
const PP_SERVER='https://profitpilot-g4ta.onrender.com';
const ADMIN=(()=>{try{return new URLSearchParams(location.search).has('admin')||location.hash==='#server'}catch(e){return false}})();
const API={ai:null,on:false,base:'',ver:null,db:null,synced:{},prefs:null,exp:null,busy:false,boot:null};
function apiBases(){const out=[];try{const q=new URLSearchParams(location.search).get('api');if(q)out.push(q.replace(/\/$/,''))}catch(e){}if(/^https?:$/.test(location.protocol))out.push('');if(PP_SERVER)out.push(PP_SERVER.replace(/\/$/,''));return out}
function apiBase(){const b=apiBases();return b.length?b[0]:null}
async function api(path,opt){opt=opt||{};const r=await fetch(API.base+'/api/v1'+path,{method:opt.method||'GET',headers:{'Content-Type':'application/json'},body:opt.body!=null?JSON.stringify(opt.body):undefined});let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok){const d=j&&j.detail;const m=(d&&(d.message||(typeof d==='string'?d:null)))||r.statusText||('HTTP '+r.status);const err=new Error(m);err.status=r.status;err.checks=d&&d.checks;throw err}return j}
async function apiConnect(){for(const b of apiBases()){API.base=b;try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),b?6000:2500);const r=await fetch(b+'/api/v1/health',{signal:c.signal});clearTimeout(tm);const j=await r.json();if(!j||j.service!=='profitpilot')continue;API.ver=j.version;API.db=j.database;API.ai=j.ai||null;await apiBootstrap();API.on=true;return true}catch(e){}}API.on=false;API.base='';return false}
function apiApplyProduct(p){const s=SK[p.id];if(!s)return;if(p.live_price!==s.live)S.live[p.id]=p.live_price;else delete S.live[p.id];S.dsm[p.id]=p.days_since_move;S.mpm[p.id]=p.moves_this_month;S.ctrl[p.id]=p.control}
async function apiBootstrap(){const b=await api('/bootstrap');API.boot=b;
 S.mode=b.seller.goal_mode;S.wins=b.seller.wins;S.live={};S.dsm={};S.mpm={};S.ov={};S.dec={};S.hist={};LCS.day={};
 b.products.forEach(p=>{const s=SK[p.id];if(!s)return;apiApplyProduct(p);const o={},c=p.costs;['cs','pack','fwd','ret','rto'].forEach(k=>{if(c[k]!==s[k])o[k]=c[k]});if(c.target!==s.T)o.T=c.target;if(p.category!==s.cat)o.cat=p.category;if(Object.keys(o).length)S.ov[p.id]=o;if(p.signals&&p.signals.day!=null)s.sig.day=p.signals.day});
 Object.entries(b.decisions||{}).forEach(([k,v])=>{S.dec[k]=v});
 Object.entries(b.history||{}).forEach(([k,h])=>{const c=h.card||{};S.hist[k]={id:h.id,from:h.from,to:h.to,kind:h.kind,h:c.h||'',W:c.W||{t:'Why?',what:c.h||'',why:[],eff:'',undo:''}}});
 API.synced=Object.assign({},S.dec);API.prefs=apiPrefsSnap()}
function apiPrefsSnap(){return JSON.stringify({m:S.mode,c:S.ctrl})}
function apiPid(k){const g=k.split(':');return SK[g[0]]?g[0]:SK[g[1]]?g[1]:null}
function apiSync(){if(!API.on||API.busy)return;const snap=apiPrefsSnap();
 if(snap!==API.prefs){const old=API.prefs?JSON.parse(API.prefs):{m:null,c:{}};API.prefs=snap;
  if(old.m!==S.mode)api('/seller',{method:'PATCH',body:{goal_mode:S.mode}}).catch(e=>toast(t('Could not save: ','Save nahi hua: ')+e.message));
  Object.keys(S.ctrl).forEach(id=>{if(old.c[id]!==S.ctrl[id]&&SK[id])api('/products/'+id,{method:'PATCH',body:{control:S.ctrl[id]}}).catch(e=>toast(t('Could not save: ','Save nahi hua: ')+e.message))})}
 Object.entries(S.dec).forEach(([k,v])=>{if(API.synced[k]!==v){API.synced[k]=v;api('/decisions',{method:'POST',body:{key:k,decision:v,kind:'info',product_id:apiPid(k)}}).catch(()=>{})}});
 Object.keys(API.synced).forEach(k=>{if(!(k in S.dec)){delete API.synced[k];api('/decisions/'+encodeURIComponent(k),{method:'DELETE'}).catch(()=>{})}})}
async function apiSaveFirstPrice(){const id=S.sku,f=FL(id);const el=()=>document.getElementById('srvfp');try{const res=await api('/products/'+id+'/first-price',{method:'POST',body:{category:f.c.cat,cs:f.cs,pack:f.pack,fwd:f.fwd,ret:f.ret,rto:f.rto,target:f.T,offer_both_prices:!!S.fp.both,seller_guess_return_cost:S.fp.guess}});
  const fp=res.first_price,ok=fp.floor.F===f.F&&fp.start_price===f.Pe&&fp.no_return_price===f.Pn;if(el())el().innerHTML=`💾 <b>${t('Saved','Save ho gaya')}</b>: F ${R(fp.floor.F)} · ${R(fp.start_price)} / ${R(fp.no_return_price)} · ${ok?'✔':'⚠ '+t('check your costs','costs check karo')}`}
 catch(e){if(el())el().textContent=t('Could not save: ','Save nahi hua: ')+e.message}}
function enFromServer(res){const st=res.state;EN.sku=S.sku;EN.mode=S.mode;EN.day=st.day;EN.arms=st.arms.map(a=>({p:a.p,pn:a.pn,a:a.a,b:a.b,a0:a.a0,b0:a.b0,n:a.n,kept:a.kept,th:a.th}));EN.hold=Object.assign({},st.hold);EN.last=st.last!=null?EN.arms.find(a=>a.p===st.last):null;EN.srv=true}
function srvWhen(iso){return iso?iso.slice(0,16).replace('T',' '):''}
async function srvRefresh(){try{const [ck,jobs,notes,aud,recs,prods]=await Promise.all([api('/admin/clock'),api('/jobs'),api('/notifications?limit=8'),api('/audit?limit=25'),api('/recommendations?mode='+S.mode),api('/products')]);
 const $=id=>document.getElementById(id);if(!$('srvClock'))return;
 $('srvClock').textContent=srvWhen(ck.now)+(ck.offset_days?` (+${ck.offset_days} ${t('days','din')})`:'');
 $('srvPar').innerHTML=`<div class="tw"><table class="t"><tr><th>${t('Product','Product')}</th><th>F ${t('here / server','yahan / server')}</th><th>${t('Card here','Yahan')}</th><th>${t('Server','Server')}</th><th></th></tr>${recs.map(sr=>{if(!SK[sr.id])return '';const lr=recFor(sr.id),fl=FL(sr.id),sp=prods.find(p=>p.id===sr.id),same=lr.key===sr.key&&sp&&sp.floor.F===fl.F;return `<tr><td>${SK[sr.id].em} ${SK[sr.id].n}</td><td>${R(fl.F)} / ${sp?R(sp.floor.F):'—'}</td><td class="xs">${lr.kind} ${R(lr.from)}→${R(lr.to)}</td><td class="xs">${sr.kind} ${R(sr.from)}→${R(sr.to)}</td><td><b class="${same?'up':'dn'}">${same?'✔':'✘'}</b></td></tr>`}).join('')}</table></div>`;
 $('srvJobs').innerHTML=jobs.checks.length?jobs.checks.slice(-12).reverse().map(c=>`<div class="ck ${c.status==='pending'?'na':c.status==='done'?'ok':'bad'}"><b>${c.status==='pending'?'⏳':c.status==='done'?'✔':'✘'}</b><span>${c.product} · ${c.move} · ${c.kind==='judge_day14'?t('day-14 judge (orders)','din 14 check'):t('day-28 confirm (kept orders)','din 28 confirm')} · ${t('due','due')} ${srvWhen(c.due_at)} · <b>${c.status}</b>${c.result?'<br><span class="mu">'+c.result.verdict+' ('+c.result.basis+')</span>':''}</span></div>`).join(''):`<span class="mu">${t('No checks yet. Accept a price move on Home: the server schedules a day-14 and a day-28 check.','Abhi koi check nahi.')}</span>`;
 $('srvNote').innerHTML=notes.length?notes.map(n=>`<div class="card flat" style="padding:8px;margin:6px 0"><b>${n.title}</b> <span class="tag">${n.week}</span><div>${n.body}</div></div>`).join(''):`<span class="mu">${t('Empty. Weekly cards appear when the server clock passes a week.','Khaali.')}</span>`;
 $('srvAudit').innerHTML=aud.map(a=>`<div style="padding:4px 0;border-bottom:1px solid rgba(0,0,0,.06)"><span class="mu xs">${srvWhen(a.at)}</span> · <b>${a.action}</b>${a.product_id?' · '+a.product_id:''} <span class="xs mu">${esc(JSON.stringify(a.detail||{})).slice(0,150)}</span></div>`).join('')}
 catch(e){toast(t('Could not save: ','Save nahi hua: ')+e.message)}}
async function srvAdvance(d){try{const r=await api('/admin/clock/advance',{method:'POST',body:{days:d,run_jobs:true}});await apiBootstrap();rerender();const v=r.ran.filter(x=>x.verdict).map(x=>'• '+x.product_id+': '+x.verdict),c=r.ran.filter(x=>x.kind==='weekly_card').length;
  const e=document.getElementById('srvRan');if(e)e.innerHTML=`<div class="greenbox" style="margin-top:8px">⏩ ${t('Server clock','Server clock')} +${d} ${t('days','din')}.${v.length?'<br>'+v.join('<br>'):' '+t('No checks were due.','Koi check due nahi tha.')}${c?'<br>• '+c+' '+t('weekly WhatsApp cards queued (simulated)','weekly cards'):''}</div>`;toast(t('Time travelled','Time travel')+' +'+d+' '+t('days','din'))}catch(e){toast(t('Could not save: ','Save nahi hua: ')+e.message)}}
async function srvReset(){if(!confirm(t('Reset all demo data on the server?','Server ka demo data reset karein?')))return;try{await api('/admin/reset',{method:'POST'});API.exp=null;await apiBootstrap();rerender();toast(t('Server demo data reset','Server reset'))}catch(e){toast(t('Could not save: ','Save nahi hua: ')+e.message)}}
VIEWS.server=()=>{if(!API.on)return `<h1>🖥️ ${t('Server','Server')}</h1><div class="card"><p>${t('This copy of the app runs fully in your browser (offline demo). Decisions are not saved anywhere.','Ye app sirf browser mein chal raha hai.')}</p><p class="sm">${t('To run it with the ProfitPilot backend, download the GitHub package and run:','Backend ke saath chalane ke liye:')}</p><div class="card flat" style="font-family:ui-monospace,Menlo,monospace;font-size:13px">python run.py</div><p class="sm mu">${t('Your laptop becomes the server at http://localhost:8000. Add --lan to open it on phones on the same Wi-Fi.','Laptop server ban jayega.')}</p><button class="btn p full" onclick="apiConnect().then(ok=>{toast(ok?'Connected':'No server found');rerender()})">↻ ${t('Try to connect','Connect karo')}</button></div>`;
 return `<h1>🖥️ ${t('Server','Server')} <span class="tag" style="background:var(--gr);color:#fff">● ${t('connected','connected')}</span></h1>
 <div class="card"><div class="row"><span>API</span><b class="sm">${API.base||location.origin}/api/v1</b></div><div class="row"><span>${t('Version','Version')}</span><b>${API.ver} · ${API.db}</b></div><div class="row"><span>${t('Server clock','Server clock')}</span><b id="srvClock">…</b></div>
  <div class="btns"><a class="btn s" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="${API.base}/docs" target="_blank" rel="noopener">📘 ${t('API docs','API docs')}</a><button class="btn s" onclick="srvRefresh()">↻ ${t('Refresh','Refresh')}</button></div></div>
 <div class="card"><h3>⏩ ${t('Time travel (demo clock)','Time travel')}</h3><div class="mu sm">${t('Move the server clock forward: cooldowns end, the 24-hour undo window closes, and the day-14 / day-28 checks run.','Server ki ghadi aage karo: cooldown, undo window, din 14/28 check.')}</div><div class="btns"><button class="btn s" onclick="srvAdvance(1)">+1 ${t('day','din')}</button><button class="btn s" onclick="srvAdvance(7)">+7 ${t('days','din')}</button><button class="btn p" onclick="srvAdvance(14)">+14 ${t('days','din')}</button></div><div id="srvRan" class="sm"></div></div>
 <div class="card"><h3>✔ ${t('Parity: this phone vs the server','Parity: phone vs server')}</h3><div class="mu sm">${t('The same engine runs in Python on the server and in JavaScript here. Both must agree to the rupee.','Dono engine ek hi jawab dein.')}</div><div id="srvPar">…</div></div>
 <div class="card"><h3>⏰ ${t('Scheduled checks','Scheduled checks')}</h3><div id="srvJobs" class="sm">…</div></div>
 <div class="card"><h3>💬 ${t('WhatsApp outbox (simulated)','WhatsApp outbox')}</h3><div id="srvNote" class="sm">…</div></div>
 <div class="card"><h3>🧾 ${t('Audit log','Audit log')}</h3><div id="srvAudit" class="sm">…</div></div>
 <div class="card flat"><button class="btn g full" onclick="srvReset()">↺ ${t('Reset demo data on the server','Server demo reset')}</button></div>`};
VIEWS.server.after=()=>{if(API.on)srvRefresh()};

try{const l=store('pp_lang');if(l==='hi'||l==='en')S.lang=l}catch(e){}
const _tl=toggleLang;toggleLang=function(){_tl();store('pp_lang',S.lang)};
render();
apiConnect().then(ok=>{if(ok)rerender()});
